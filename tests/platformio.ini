; Native Unit-Tests für lib/mtb_common (laufen auf dem PC, keine Hardware nötig)
;   pio test -d tests
[platformio]
src_dir = src

[env:native]
platform = native
test_framework = unity
; Header-only-Bibliothek direkt einbinden (der Library-Finder durchsucht Tests nicht)
build_flags = -std=gnu++17 -Wall -Wextra -Werror -Wno-format-truncation -I ../lib/mtb_common/src

; Wie native, aber 32 Bit (unsigned long = 32 Bit wie auf dem ESP32) – benötigt gcc-multilib
[env:native32]
extends = env:native
build_flags = ${env:native.build_flags} -m32 -DUNITY_SUPPORT_64
extra_scripts = m32.py
