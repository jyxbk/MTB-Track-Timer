; PlatformIO – START-NODE (Heltec WiFi LoRa 32 V3, Luftdruck BMP280)
; Diesen Ordner in VSCode öffnen: File → Open Folder → MTB_Timer_Start_LUFT
; OTA-Firmware: .pio/build/Start_LUFT/firmware.bin

[platformio]
src_dir = .

[env:Start_LUFT]
platform      = espressif32 @ 8.0.0
board         = heltec_wifi_lora_32_V3
framework     = arduino
monitor_speed = 115200

lib_deps =
    symlink://../lib/mtb_common
    jgromes/RadioLib @ ^6.6.0
    olikraus/U8g2    @ ^2.35.19
    adafruit/Adafruit BMP280 Library @ ^2.6.8
