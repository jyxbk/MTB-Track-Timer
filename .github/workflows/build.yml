name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unit tests (lib/mtb_common)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO and 32-bit toolchain
        run: |
          pip install platformio
          sudo apt-get update -q && sudo apt-get install -y -q g++-multilib

      - name: Run unit tests (64 + 32 bit)
        run: pio test -d tests

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - MTB_Timer_Start
          - MTB_Timer_Start_LILYGO
          - MTB_Timer_Start_LUFT
          - MTB_Timer_Finish
          - MTB_Timer_Finish_LILYGO
          - MTB_Timer_Finish_LUFT
          - MTB_Timer_Split
          - MTB_Timer_Split_LILYGO
          - MTB_Timer_Split_LUFT
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ${{ matrix.node }}
        run: tools/build_all.sh ${{ matrix.node }}

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.node }}
          path: ${{ matrix.node }}/.pio/build/*/firmware.bin
          if-no-files-found: error
