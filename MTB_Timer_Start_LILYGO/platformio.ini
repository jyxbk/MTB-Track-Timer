; PlatformIO – START-NODE (LILYGO TTGO T3 V1.6.1, Druckplatte, SD)
; Diesen Ordner in VSCode öffnen: File → Open Folder → MTB_Timer_Start_LILYGO
; OTA-Firmware: .pio/build/Start_LILYGO/firmware.bin

[platformio]
src_dir = .

[env:Start_LILYGO]
platform      = espressif32 @ 8.0.0
board         = ttgo-lora32-v21
framework     = arduino
monitor_speed = 115200
; 4 MB Flash: App-Partition 1,9 MB (statt 1,25 MB) inkl. OTA – Arduino IDE: „Minimal SPIFFS“
board_build.partitions = min_spiffs.csv

lib_deps =
    jgromes/RadioLib @ ^6.6.0
    olikraus/U8g2    @ ^2.35.19
